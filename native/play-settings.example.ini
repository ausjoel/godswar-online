# GodsWar Native (exe-port) settings. play.command copies this to play-settings.ini (mode 600) on first run;
# edit play-settings.ini, not this file. Lines starting with # are comments.
#
# client: the GodsWar client folder (relative paths are relative to this file); exe: its game exe (default GodsWar.exe)
client=../../Development/client-1.5.1/Client
#
# server/port: the login server. Default = the LIVE server (the same one players use).
# Type your own account and password on the game's login screen; nothing is saved.
server=YOUR_SERVER_IP
port=6999
#
# Private test rig on this Mac instead (start the rig first, see Development/HANDOFF.md):
# put a # in front of the two lines above and remove the # from these two.
#server=10.211.55.2
#port=16999
#
# sound: 1 = play through the default output device, 0 = silent
sound=1
# window size the game renders at (the window can be resized; the image scales)
width=1024
height=768
# avatar: 2 = new character models (default), 1 = old models
avatar=2
