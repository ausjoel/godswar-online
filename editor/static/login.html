<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GodsWar editor login</title><link rel="stylesheet" href="/static/login.css"><script src="/static/login.js" defer></script></head><body><main><h1>GodsWar editor</h1><p>Sign in with a GodsWar account that has editor administrator access.</p><form id="login"><label>Account<input name="username" autocomplete="username" maxlength="32" required></label><label>Password<input name="password" type="password" autocomplete="current-password" maxlength="32" required></label><button>Sign in</button><p id="message" role="status"></p></form><details><summary>Owner recovery login</summary><form id="recovery"><label>Owner account<input name="username" autocomplete="username" value="admin" maxlength="32" required></label><label>Owner password<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><button>Sign in as owner</button><p class="message" role="status"></p></form></details></main></body></html>
