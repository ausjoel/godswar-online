{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card">
  {% if badge %}<p class="badge">{{ badge }}</p>{% endif %}
  <h1>{{ title }}</h1>
  <p class="lead">{{ text }}</p>
  {% if link %}<p><a class="go link" href="{{ link }}">{{ link_text }}</a></p>{% endif %}
  {% if retry %}<p><a class="go link" href="/">Back to the sign-up page</a></p>{% endif %}
</section>
{% endblock %}
